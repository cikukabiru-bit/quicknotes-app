<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>A note for your day</p>
  </header>

  <main>
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note</label>
        <input type="text" id="note-input" placeholder="Type your note here">

        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="personal">Personal</option>
          <option value="work">Work</option>
          <option value="study">Study</option>
        </select>

        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
    </section>

    <section>
      <h2>Your notes</h2>
      <label for="search-input">Search</label>
      <input type="text" id="search-input" placeholder="Search your notes">
      <p id="note-count">You have no notes yet.</p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>QuickNotes Project 1-Diana Anne</p>
  </footer>
</body>
</html>
